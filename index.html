<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171b35"><title>달무리책방</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet"><style>
:root{color-scheme:light;--bg:#f2f4fa;--card:#fff;--ink:#1b2140;--muted:#707895;--line:#dfe3ef;--gold:#dfa52c;--hero:#171b35}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 'Noto Sans KR',sans-serif}header{height:64px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(20px,calc((100% - 980px)/2));gap:18px;position:sticky;top:0;z-index:2}.logo{font:900 23px 'Noto Serif KR';text-decoration:none;color:var(--ink);margin-right:auto}.logo b{color:var(--gold)}button,input{font:inherit}.chip{border:1px solid var(--line);border-radius:24px;padding:7px 14px;background:transparent;color:inherit;cursor:pointer}main{max-width:940px;margin:auto;padding:0 20px 70px}.hero{margin:0 -20px;padding:58px 20px 48px;background:var(--hero);color:white;position:relative;overflow:hidden}.hero:after{content:'☾';position:absolute;right:8%;top:-65px;font-size:220px;color:#f0c96d;opacity:.18}.hero h1{font:900 clamp(30px,6vw,48px)/1.3 'Noto Serif KR';margin:0 0 10px;position:relative}.hero p{max-width:520px;color:#d9dced;position:relative}.section{font:700 22px 'Noto Serif KR';margin:34px 0 14px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:25px 0}.toolbar input{flex:1;min-width:180px;padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:15px}.book{display:flex;gap:15px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer}.cover{width:82px;height:116px;flex:none;border-radius:5px;background:linear-gradient(145deg,#4e5ca9,#1a2147);color:#fff;display:grid;place-items:center;text-align:center;padding:8px;font:900 18px 'Noto Serif KR';box-shadow:inset 5px 0 #ffffff20}.book h3{font:700 18px 'Noto Serif KR';margin:2px 0}.meta{font-size:13px;color:var(--muted)}.book p{font-size:14px;color:var(--muted);margin:7px 0}.view{display:none}.view.active{display:block}.back{margin:24px 0 10px}.btn{display:inline-block;border:0;border-radius:8px;background:var(--gold);color:#211d15;font-weight:700;padding:10px 18px;cursor:pointer;text-decoration:none}.episodes{padding:0;list-style:none;border:1px solid var(--line);border-radius:10px;background:var(--card)}.episodes li+li{border-top:1px solid var(--line)}.episodes button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:15px;text-align:left;cursor:pointer;color:inherit}.reader{max-width:700px;margin:30px auto}.reader h1{font:900 28px 'Noto Serif KR'}.bodytext{font:18px/2 'Noto Serif KR';white-space:pre-wrap;word-break:keep-all;margin-top:28px}.empty{padding:30px;color:var(--muted);text-align:center}footer{text-align:center;color:var(--muted);font-size:13px;padding:30px}

</style></head><body><header><a class="logo" href="#" onclick="home();return false">달무리<b>책방</b></a><button class="chip" onclick="toggleTheme()">화면 모드</button><button class="chip" onclick="showLibrary()">내 서재</button></header><main><section class="hero"><h1>오늘 밤, 읽을 이야기를 고르세요</h1><p>하루의 끝에 펼쳐 보는 새로운 세계. 달무리책방에서 이야기를 만나보세요.</p></section><section id="home" class="view active"><h2 class="section">책장</h2><div class="toolbar"><input id="search" placeholder="제목 또는 작가 검색" oninput="renderBooks()"><button class="chip" onclick="filterGenre='전체';renderBooks()">전체</button><button class="chip" onclick="filterGenre='판타지';renderBooks()">판타지</button></div><div id="books" class="grid"></div></section><section id="detail" class="view"></section><section id="reader" class="view"></section><section id="library" class="view"></section></main><footer>달무리책방 · 웹소설을 읽는 작은 공간</footer>
<script>
let data={novels:[{id:1,t:'무한차원',a:'나',g:'판타지',s:'연재중',c:'#2f3f8f',d:'무한히 펼쳐진 차원, 끝없이 이어지는 가능성. 지구의 모든 인간이 사라지고 낯선 차원에서 눈을 뜬 한도윤. 레벨, 능력치, 스킬, 업적이 존재하는 세계에서 살아남기 위한 여정이 시작된다.',e:[{t:'마지막 테스터',x:['서울 외곽.','지도에는 표시되지 않는 연구단지 지하 7층에 한 남자가 앉아 있었다.','한도윤. 스물여덟 살.','그는 책상 위에 놓인 커피를 한 모금 마시고 모니터를 바라보았다. 커피는 이미 식어 있었다. 오늘만 세 번째로 데운 커피였다.','모니터에는 수많은 창이 떠 있었다.','차원 생성 시뮬레이션. 생명체 행동 모델. 종족 데이터베이스. 스킬 생성기. 업적 판정 모듈. 차원 간 이동 검증기.','일반적인 게임 개발팀이라면 수십, 어쩌면 수백 명이 나누어 맡았을 작업이었다. 하지만 이 프로젝트는 달랐다.','핵심 개발과 관리는 인공지능이 담당했다.','인간은 AI가 만들어 낸 결과가 의도한 대로 작동하는지 확인하고, 예외 상황을 찾아내며, 오류를 보고했다.','도윤은 그중에서도 실제 사용자의 관점에서 기능을 시험하는 테스터였다.','프로젝트의 이름은 INFINITE DIMENSION.','말 그대로 무한한 차원을 생성하고 관리하는 프로젝트였다.','처음 이 일을 맡았을 때 도윤은 단순히 거대한 가상 세계를 만드는 실험이라고 생각했다. 하지만 테스트를 거듭할수록 그 규모는 상상을 넘어섰다.','하나의 차원 안에 서로 다른 문명과 종족이 존재했다. 차원마다 물리 법칙과 마법 체계가 달랐고, 어떤 차원에서는 시간이 흐르는 방식조차 달랐다.','AI는 단순히 지형을 배치하는 것이 아니었다.','역사를 만들고, 생명체를 설계하고, 문명이 발전할 조건을 부여했다. 생명체들은 각자의 환경에서 살아가며 서로 영향을 주었다. 그 결과로 전쟁이 일어나거나 국가가 탄생하기도 했다.','물론 도윤이 그 모든 것을 직접 확인한 것은 아니었다. 무한하다는 이름에 걸맞게 테스트 대상은 끝이 없었고, 테스터에게 공개되는 정보에도 제한이 있었다.','그가 담당한 것은 전체 프로젝트의 극히 일부였다.','그럼에도 스킬 생성 시스템만큼은 여러 차례 테스트했다.','스킬은 전투 기술에 한정되지 않았다. 채집, 제작, 언어, 감각, 기억, 이동, 생존 등 다양한 분야의 능력이 생성될 수 있었다.','업적 시스템 역시 존재했다.','어떤 행동이나 사건이 조건을 충족하면 업적이 기록되고, 업적에 대응하는 보상이 부여되는 구조였다.','도윤은 테스트 결과를 확인하며 손가락으로 책상을 두드렸다.','"이제 진짜 끝인가."','오늘은 최종 통합 테스트 날이었다.','그가 맡은 항목은 차원 생성 결과와 스킬 관리 기능의 연동이었다.','모니터 오른쪽 위에는 진행률이 표시되어 있었다.','[통합 테스트: 98.7%]','도윤은 로그를 위에서부터 다시 훑었다.','차원 환경 생성. 정상.','생명체 행동 모델. 정상.','종족 특성 적용. 정상.','스킬 습득 및 숙련도 반영. 정상.','업적 조건 판정. 정상.','차원 간 데이터 분리. 정상.','그는 마지막 항목을 열었다.','[테스터 개입에 따른 세계 데이터 안정성 검증]','"이건 또 뭐야."','항목 설명에는 간단한 문장만 적혀 있었다.','테스터가 차원 내부의 생명체 및 환경 데이터에 접근할 때, 원본 데이터와 테스트 데이터가 분리되어야 한다.','도윤은 준비된 테스트 계정을 선택했다.','가상의 차원 하나가 화면에 나타났다. 황량한 평원과 낮은 산맥, 작은 강이 이어진 평범한 풍경이었다.','그는 생명체 하나를 선택하고 상태 정보를 열었다.','기본 능력치. 보유 스킬. 종족 특성. 현재 행동. 주변 환경.','정보는 정상적으로 표시되었다.','도윤은 시험용 명령을 입력했다.','[테스트 대상의 스킬 데이터 변경]','[변경 전 데이터 보존 확인]','[테스트 데이터 분리 확인]','[검증 완료]','"좋아."','그가 확인 버튼을 누르자 진행률이 움직였다.','[통합 테스트: 100%]','곧이어 화면 중앙에 결과창이 나타났다.','[전체 테스트 완료]','[오류: 발견되지 않음]','[최종 검증을 종료하시겠습니까?]','도윤은 의자에 기대어 눈을 감았다.','오랫동안 붙잡고 있던 프로젝트였다. 자신이 모든 것을 만든 것은 아니었지만, 수많은 테스트를 거치며 익숙해진 시스템이었다.','그는 확인 버튼을 누르기 전에 잠시 망설였다.','"이걸로 끝이라니."','그때 연구실 문이 열렸다.','"한도윤 테스터님."','정장 차림의 남자가 들어왔다. 프로젝트 관리 담당자였다.','"최종 테스트가 끝났습니까?"','"네. 전 항목 통과했습니다. 오류도 없습니다."','"수고하셨습니다. 결과를 제출해 주십시오."','도윤은 테스트 보고서를 전송했다.','남자는 모니터를 확인한 뒤 고개를 끄덕였다.','"이제 테스터님의 업무는 종료됩니다."','"프로젝트 자체도 끝나는 겁니까?"','남자는 바로 대답하지 않았다.','"테스터님이 확인하실 수 있는 단계는 끝났습니다."','묘하게 선을 긋는 대답이었다.','도윤은 그를 바라보았다.','"그럼 이제 실제 운영 단계로 넘어가는 건가요?"','"그 부분은 공개할 수 없습니다."','"제가 마지막까지 테스트했는데도요?"','"계약상 안내드릴 수 없는 사항입니다."','도윤은 작게 한숨을 내쉬었다.','그럴 줄 알았다. 이 프로젝트는 처음부터 비밀이 많았다.','그는 더 묻지 않았다.','관리 담당자는 짧게 인사하고 방을 나갔다.','문이 닫히자 연구실에는 키보드 소리와 환풍기 소리만 남았다.','도윤은 자리에서 일어나 스트레칭을 했다.','그때 모니터가 깜빡였다.','처음에는 단순한 화면 오류라고 생각했다.','하지만 모든 창이 동시에 닫혔다.','"어?"','검은 화면 위로 흰 글자가 나타났다.','[최종 동기화 대기 중]','도윤은 마우스를 움직였다. 반응이 없었다.','키보드를 눌러도 마찬가지였다.','잠시 후 두 번째 문장이 나타났다.','[테스터 데이터 확인 중]','그 아래에 알 수 없는 숫자와 기호가 빠르게 지나갔다.','도윤은 의자에서 일어나 연구실 출입문 쪽을 바라보았다. 문 옆의 보안 표시등은 꺼져 있었다.','"이건 테스트 항목에 없었는데."','그는 비상 연락 버튼을 눌렀다.','아무런 반응이 없었다.','모니터에 새로운 문장이 떠올랐다.','[동기화 대상 확인 완료]','[테스터: 한도윤]','[연결을 시작합니다.]','"잠깐. 연결이라고?"','도윤은 한 걸음 뒤로 물러났다.','연구실의 조명이 한꺼번에 꺼졌다.','어둠 속에서 모니터만 빛났다.','[동기화 진행률: 1%]','숫자가 올라가기 시작했다.','2%.','5%.','12%.','도윤은 문 쪽으로 움직였다. 손잡이를 잡아당겼지만 문은 열리지 않았다.','"문 열어!"','대답은 없었다.','[동기화 진행률: 37%]','그 순간, 바닥에서 진동이 느껴졌다.','연구실 전체가 흔들리는 듯했다. 모니터에서 흘러나온 빛이 벽면을 가득 채웠다.','도윤은 눈을 가렸다.','[동기화 진행률: 82%]','"대체 무슨 일이야……!"','[동기화 진행률: 100%]','그리고 마지막 문장이 나타났다.','[연결 완료.]','빛이 연구실을 삼켰다.','도윤의 의식이 끊어졌다.','차가운 감촉이 뺨에 닿았다.','도윤은 천천히 눈을 떴다.','가장 먼저 보인 것은 나뭇잎이었다.','그는 한동안 움직이지 않았다. 머리가 멍했고, 몸 곳곳이 뻐근했다.','하늘은 맑았다.','나무들은 높고 울창했다.','바람이 불 때마다 잎사귀가 서로 부딪히며 작은 소리를 냈다.','도윤은 팔꿈치로 땅을 짚고 상체를 일으켰다.','"여기가…… 어디야?"','그의 목소리가 숲속으로 흩어졌다.','주변에는 사람이 보이지 않았다. 연구실도, 모니터도, 잠겨 있던 문도 없었다.','그는 자신이 입고 있던 옷을 확인했다. 연구실에서 입었던 셔츠와 바지 그대로였다. 주머니를 뒤졌지만 휴대전화는 없었다.','납치인가?','가장 먼저 떠오른 생각이었다.','하지만 주변에 사람의 흔적은 없었다. let favorites=JSON.parse(localStorage.getItem('moon-favs')||'[]'),filterGenre='전체';
function view(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0)}
function publishedEpisodes(n){const now=Date.now();return n.e.map((e,index)=>({e,index})).filter(item=>!item.e.publishAt||new Date(item.e.publishAt).getTime()<=now)}
function renderBooks(){let q=(document.getElementById('search')?.value||'').toLowerCase();let list=data.novels.filter(n=>(filterGenre==='전체'||n.g===filterGenre)&&(n.t+n.a).toLowerCase().includes(q));document.getElementById('books').innerHTML=list.map(n=>'<article class="book" onclick="showNovel('+n.id+')"><div class="cover">'+n.t+'</div><div><h3>'+n.t+'</h3><div class="meta">'+n.a+' · '+n.g+' · '+n.s+' · '+publishedEpisodes(n).length+'화</div><p>'+n.d+'</p></div></article>').join('')||'<p class="empty">검색 결과가 없습니다.</p>'}
function home(){view('home');renderBooks()}
function showNovel(id){window.currentNovelId=id;let n=data.novels.find(x=>x.id===id),eps=publishedEpisodes(n);document.getElementById('detail').innerHTML='<button class="chip back" onclick="home()">← 책장</button><div class="book"><div class="cover">'+n.t+'</div><div><h1>'+n.t+'</h1><div class="meta">'+n.a+' · '+n.g+' · '+n.s+'</div><p>'+n.d+'</p>'+(eps.length?'<button class="btn" onclick="readEpisode('+id+','+eps[0].index+')">첫 화 읽기</button>':'<p class="meta">아직 공개된 회차가 없습니다.</p>')+' <button class="chip" onclick="toggleFav('+id+')">'+(favorites.includes(id)?'서재에서 빼기':'내 서재에 담기')+'</button></div></div><h2 class="section">전체 회차</h2><ul class="episodes">'+(eps.map(({e,index})=>'<li><button onclick="readEpisode('+id+','+index+')"><span>'+(eps.findIndex(x=>x.index===index)+1)+'화 · '+e.t+'</span><span>'+(Number(e.price)>0?(hasPurchased(n,e,index)?'구매 완료':'구매 · '+Number(e.price)+'코인'):'무료')+' →</span></button></li>').join('')||'<li class="empty">공개된 회차가 없습니다.</li>')+'</ul>';view('detail')}
function readEpisode(id,i){let n=data.novels.find(x=>x.id===id),e=n?.e[i];if(!e|| (e.publishAt&&new Date(e.publishAt).getTime()>Date.now())){showNovel(id);return}let price=Math.max(0,Number(e.price)||0);if(price>0&&!hasPurchased(n,e,i)){document.getElementById('reader').innerHTML='<button class="chip" onclick="showNovel('+id+')">← 회차 목록</button><article class="reader"><div class="meta">'+n.t+'</div><h1>'+e.t+'</h1><p>이 회차는 유료 회차야.</p><p>가격: '+price+'코인</p><p>보유 코인: '+coins()+'개</p><button class="btn" data-buy="'+id+':'+i+'">코인으로 구매하기</button></article>';view('reader');return}let eps=publishedEpisodes(n),number=eps.findIndex(x=>x.index===i)+1;document.getElementById('reader').innerHTML='<button class="chip" onclick="showNovel('+id+')">← 회차 목록</button><article class="reader"><div class="meta">'+n.t+'</div><h1>'+number+'화 · '+e.t+'</h1><div class="bodytext">'+e.x.join('\n\n')+'</div><div style="margin-top:40px"><button class="btn" onclick="showNovel('+id+')">목록으로</button></div></article>';view('reader')}
function toggleFav(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem('moon-favs',JSON.stringify(favorites));showNovel(id)}
function showLibrary(){document.getElementById('library').innerHTML='<button class="chip back" onclick="home()">← 책장</button><h2 class="section">내 서재</h2><div class="grid">'+data.novels.filter(n=>favorites.includes(n.id)).map(n=>'<article class="book" onclick="showNovel('+n.id+')"><div class="cover">'+n.t+'</div><div><h3>'+n.t+'</h3><div class="meta">'+n.a+' · '+n.g+'</div></div></article>').join('')+'</div>'+(favorites.length?'':'<p class="empty">아직 담은 작품이 없습니다.</p>');view('library')}
function toggleTheme(){document.documentElement.classList.toggle('dark');localStorage.setItem('moon-dark',document.documentElement.classList.contains('dark'))}
if(localStorage.getItem('moon-dark')==='true')document.documentElement.classList.add('dark');renderBooks();
</script>
<style>
.admin-wrap{max-width:940px;margin:28px auto;padding:0 20px}.admin-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}.admin-card h2,.admin-card h3{font-family:'Noto Serif KR';margin:0 0 14px}.admin-card label{display:block;color:var(--muted);font-size:14px;margin:10px 0 5px}.admin-card input,.admin-card textarea,.admin-card select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}.admin-card textarea{min-height:180px;resize:vertical}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.coin-page{text-align:center;padding:65px 15px}.coin-number{font:900 76px 'Noto Serif KR';color:var(--gold);margin:20px}.admin-list{border-top:1px solid var(--line);padding:12px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.small-btn{padding:6px 10px;border-radius:20px;border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer}@media(max-width:600px){.admin-grid{grid-template-columns:1fr}}
</style>
<script>
(()=>{
 const $=s=>document.querySelector(s);
 const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let loggedIn=false,editingEpisode=null;
 function addViews(){
  const h=document.querySelector('header');
  const admin=document.createElement('button');admin.className='chip';admin.id='adminEntry';admin.textContent='관리자 로그인';admin.onclick=login;h.appendChild(admin);
  const coin=document.createElement('button');coin.className='chip';coin.id='coinEntry';coin.textContent='코인 얻기 · '+coins();coin.onclick=showCoins;h.appendChild(coin);
  const m=document.querySelector('main');
  const a=document.createElement('section');a.id='adminView';a.className='view';a.innerHTML=adminHTML();m.appendChild(a);
  const c=document.createElement('section');c.id='coinsView';c.className='view';c.innerHTML='<div class="coin-page"><h2 class="section">코인 얻기</h2><p>버튼을 누를 때마다 1코인을 받습니다.</p><div class="coin-number" id="coinCount">'+coins()+'</div><button class="btn" id="coinPlus">코인 받기 +1</button></div>';m.appendChild(c);
 }
 function coins(){const saved=localStorage.getItem('moon-coins');if(saved===null){localStorage.setItem('moon-coins','200');return 200}const value=Number(saved);return Number.isSafeInteger(value)&&value>=0?value:0}
 function purchasedEpisodes(){try{return JSON.parse(localStorage.getItem('moon-purchases')||'[]')}catch{return []}}
 function episodePurchaseKey(n,e,i){return String(n.id)+':'+String(e.uid||i)}
 function hasPurchased(n,e,i){return purchasedEpisodes().includes(episodePurchaseKey(n,e,i))}
 function buyEpisode(id,i){const n=data.novels.find(x=>String(x.id)===String(id)),e=n?.e[i];if(!n||!e)return;const price=Math.max(0,Number(e.price)||0);if(price===0||hasPurchased(n,e,i)){readEpisode(id,i);return}if(coins()<price){alert('코인이 부족합니다. 필요한 코인: '+price+'개');return}if(!confirm(price+'코인을 사용해 이 회차를 구매할까요?'))return;localStorage.setItem('moon-coins',String(coins()-price));const list=purchasedEpisodes();list.push(episodePurchaseKey(n,e,i));localStorage.setItem('moon-purchases',JSON.stringify(list));$('#coinEntry').textContent='코인 얻기 · '+coins();readEpisode(id,i)}
 function adminHTML(){return '<div class="admin-wrap"><h2 class="section">관리자 페이지</h2><div class="admin-card"><h3>새 작품 만들기</h3><div class="admin-grid"><div><label>제목</label><input id="newTitle"></div><div><label>작가명</label><input id="newAuthor"></div><div><label>장르</label><input id="newGenre" placeholder="판타지"></div><div><label>상태</label><select id="newStatus"><option>연재중</option><option>완결</option><option>휴재</option></select></div></div><label>표지 색</label><input id="newColor" type="color" value="#2f3f8f"><label>소개</label><textarea id="newDesc"></textarea><button class="btn" id="createNovel">작품 만들기</button></div><div class="admin-card"><h3>새 회차 올리기</h3><label>작품</label><select id="episodeNovel"></select><label>회차 제목</label><input id="episodeTitle"><label>본문</label><textarea id="episodeBody"></textarea><label>회차 가격 (코인, 무료는 0)</label><input id="episodePrice" type="number" min="0" step="1" value="0"><label><input id="episodeSchedule" type="checkbox" style="width:auto"> 예약 공개</label><label>공개 시각</label><input id="episodeDate" type="datetime-local"><button class="btn" id="createEpisode">회차 저장</button> <button class="chip" id="cancelEpisodeEdit" style="display:none">수정 취소</button></div><div class="admin-card"><h3>작품 관리</h3><div id="manageList"></div></div><button class="chip" id="adminLogout">로그아웃</button></div>'}
 async function loadNovels(){const r=await fetch('/api/novels');if(r.ok){const j=await r.json();if(Array.isArray(j.novels))data.novels=j.novels;renderBooks()}}
 async function login(){
  const password=prompt('관리자 비밀번호를 입력하세요.');if(!password)return;
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){alert(j.error||'로그인에 실패했습니다.');return}
  loggedIn=true;$('#adminEntry').textContent='관리자 메뉴';await loadNovels();renderAdmin();view('adminView');
 }
 async function save(){
  const r=await fetch('/api/novels',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({novels:data.novels})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'저장에 실패했습니다.');
  await loadNovels();renderAdmin();alert('저장 완료! 사이트 데이터가 업데이트됐습니다.');
 }
 function renderAdmin(){
  const s=$('#episodeNovel');if(!s)return;
  s.innerHTML=data.novels.map(n=>'<option value="'+n.id+'">'+esc(n.t)+'</option>').join('');
  $('#manageList').innerHTML=data.novels.map(n=>'<div class="admin-list"><b>'+esc(n.t)+'</b><span>'+n.e.length+'화 <button class="small-btn" data-delnovel="'+n.id+'">작품 삭제</button></span></div>'+n.e.map((e,i)=>'<div class="admin-list" style="padding-left:18px"><span>'+(i+1)+'화 · '+esc(e.t)+' · '+(Number(e.price)||0)+'코인</span><span><button class="small-btn" data-editepisode="'+n.id+':'+i+'">수정</button> <button class="small-btn" data-delepisode="'+n.id+':'+i+'">삭제</button></span></div>').join('')).join('')||'등록된 작품이 없습니다.';
 }
 function showCoins(){view('coinsView');$('#coinCount').textContent=coins()}
 window.showNovel=showNovel;window.readEpisode=readEpisode;
 setInterval(()=>{if(document.getElementById('detail')?.classList.contains('active')){const id=window.currentNovelId;if(id!==undefined)showNovel(id)}renderBooks()},15000);
 document.addEventListener('click',async e=>{
  try{
   if(e.target.id==='coinPlus'){const n=coins()+1;localStorage.setItem('moon-coins',n);$('#coinCount').textContent=n;$('#coinEntry').textContent='코인 얻기 · '+n}
   if(e.target.dataset.buy){const [id,i]=e.target.dataset.buy.split(':');buyEpisode(id,Number(i))}
   if(e.target.id==='createNovel'){const t=$('#newTitle').value.trim();if(!t)throw Error('작품 제목을 입력해 주세요.');data.novels.push({id:Math.max(0,...data.novels.map(n=>Number(n.id)||0))+1,t,a:$('#newAuthor').value.trim()||'작가',g:$('#newGenre').value.trim()||'기타',s:$('#newStatus').value,c:$('#newColor').value,d:$('#newDesc').value.trim(),e:[]});await save()}
   if(e.target.id==='createEpisode'){const n=data.novels.find(x=>String(x.id)===$('#episodeNovel').value),t=$('#episodeTitle').value.trim(),body=$('#episodeBody').value;if(!n||!t||!body.trim())throw Error('작품, 회차 제목, 본문을 입력해 주세요.');const scheduled=$('#episodeSchedule').checked,date=$('#episodeDate').value;if(scheduled&&!date)throw Error('예약 공개 시각을 선택해 주세요.');const price=Number($('#episodePrice').value||0);if(!Number.isSafeInteger(price)||price<0)throw Error('가격은 0 이상의 정수로 입력해 주세요.');const target=editingEpisode?data.novels.find(x=>String(x.id)===String(editingEpisode.id)):n;const oldEpisode=editingEpisode?target?.e[editingEpisode.index]:null;const episode={uid:oldEpisode?.uid||('ep-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)),t,x:body.split(/\n\s*\n/),price,...(scheduled&&date?{publishAt:new Date(date).toISOString()}:{})};if(editingEpisode){if(!target||!oldEpisode)throw Error('수정할 회차를 찾을 수 없습니다.');target.e[editingEpisode.index]=episode}else n.e.push(episode);editingEpisode=null;$('#createEpisode').textContent='회차 저장';$('#cancelEpisodeEdit').style.display='none';$('#episodeTitle').value='';$('#episodeBody').value='';$('#episodePrice').value='0';$('#episodeSchedule').checked=false;$('#episodeDate').value='';await save()}
   if(e.target.dataset.delnovel){if(confirm('이 작품과 모든 회차를 삭제할까요?')){data.novels=data.novels.filter(n=>String(n.id)!==e.target.dataset.delnovel);await save()}}
   if(e.target.dataset.editepisode){const [id,i]=e.target.dataset.editepisode.split(':');const n=data.novels.find(x=>String(x.id)===id),ep=n?.e[Number(i)];if(!ep)throw Error('회차를 찾을 수 없습니다.');editingEpisode={id,index:Number(i)};$('#episodeNovel').value=id;$('#episodeTitle').value=ep.t||'';$('#episodeBody').value=Array.isArray(ep.x)?ep.x.join('\n\n'):String(ep.x||'');$('#episodePrice').value=Number(ep.price)||0;$('#episodeSchedule').checked=!!ep.publishAt;$('#episodeDate').value=ep.publishAt?(()=>{const d=new Date(ep.publishAt);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)})():'';$('#createEpisode').textContent='수정 내용 저장';$('#cancelEpisodeEdit').style.display='inline-block';view('adminView');$('#episodeTitle').scrollIntoView({behavior:'smooth',block:'center'})}
   if(e.target.id==='cancelEpisodeEdit'){editingEpisode=null;$('#episodeTitle').value='';$('#episodeBody').value='';$('#episodePrice').value='0';$('#episodeSchedule').checked=false;$('#episodeDate').value='';$('#createEpisode').textContent='회차 저장';$('#cancelEpisodeEdit').style.display='none'}
   if(e.target.dataset.delepisode){const [id,i]=e.target.dataset.delepisode.split(':');const n=data.novels.find(x=>String(x.id)===id);if(n&&confirm('이 회차를 삭제할까요?')){n.e.splice(Number(i),1);await save()}}
   if(e.target.id==='adminLogout'){await fetch('/api/logout',{method:'POST'});loggedIn=false;$('#adminEntry').textContent='관리자 로그인';home()}
  }catch(err){alert(err.message)}
 });
 addViews();
 loadNovels().catch(()=>{});
})();
</script>

</body></html>
